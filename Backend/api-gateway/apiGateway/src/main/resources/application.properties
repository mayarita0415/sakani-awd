
spring.application.name=Api_gateway
server.port=8090

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ANNONCE-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].id=ANNONCE-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://ANNONCE-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/annonces,/api/annonces/**

# Actuator
management.endpoints.web.exposure.include=health,info

# Gateway debugging
logging.level.org.springframework.cloud.gateway=DEBUG
