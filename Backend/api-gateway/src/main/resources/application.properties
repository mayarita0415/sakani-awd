
spring.application.name=api-gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Gateway MVC - Microservice 1
spring.cloud.gateway.server.webmvc.routes[0].id=microservice1
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://MICROSERVICE1
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/microservice1/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.gateway.access=unrestricted
eureka.instance.home-page-url=http://localhost:8080/microservice1/hello
eureka.instance.status-page-url=http://localhost:8080/microservice1/hello
eureka.instance.metadata-map.home-page-url=http://localhost:8080/microservice1/hello